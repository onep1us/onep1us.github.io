<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>

  <!-- 生命线 -->
  <line x1="120" y1="84" x2="120" y2="522" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="310" y1="84" x2="310" y2="522" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="560" y1="84" x2="560" y2="522" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="760" y1="84" x2="760" y2="522" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="930" y1="84" x2="930" y2="522" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 参与者头部 -->
  <rect x="60" y="40" width="120" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="61" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle">Producer</text>

  <rect x="240" y="40" width="140" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="61" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle">ClientConnection</text>

  <rect x="490" y="40" width="140" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="61" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">ConnectionHandler</text>

  <rect x="690" y="40" width="140" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="61" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">TopicStore</text>

  <rect x="860" y="40" width="140" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="930" y="61" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">PartitionLog</text>

  <g font-size="12.5" fill="#0f172a">
    <!-- 1 -->
    <line x1="120" y1="100" x2="300" y2="100" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="210" y="92" text-anchor="middle" font-weight="600">① send(topic, value)</text>

    <!-- 2 self: correlationId++ 编码 -->
    <path d="M 310 128 h 18 v 26 h -18" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="340" y="132" font-weight="600">② correlationId++ · 编码 PRODUCE 帧</text>

    <!-- 3 -->
    <line x1="310" y1="168" x2="548" y2="168" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="429" y="160" text-anchor="middle" font-weight="600">③ [TCP] 发送请求帧</text>

    <!-- 4 self -->
    <path d="M 560 196 h 18 v 26 h -18" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="590" y="200" font-weight="600">④ 顺序读帧 · 按 MessageType 分发</text>

    <!-- 5 -->
    <line x1="560" y1="236" x2="748" y2="236" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="654" y="228" text-anchor="middle" font-weight="600">⑤ resolveForAppend(topic, -1)</text>

    <!-- 6 -->
    <line x1="760" y1="274" x2="918" y2="274" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="839" y="266" text-anchor="middle" font-weight="600">⑥ append(key, value)</text>

    <!-- 7 self -->
    <path d="M 930 302 h 22 v 26 h -22" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="912" y="306" font-weight="600" text-anchor="end">⑦ 追加写 0.log · 更新索引 · (fsync)</text>

    <!-- 8 return -->
    <line x1="930" y1="346" x2="770" y2="346" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
    <text x="850" y="338" text-anchor="middle" fill="#475569">return offset</text>

    <!-- 9 return -->
    <line x1="760" y1="384" x2="570" y2="384" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
    <text x="665" y="376" text-anchor="middle" fill="#475569">return offset</text>

    <!-- 10 self -->
    <path d="M 560 412 h 18 v 26 h -18" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="590" y="416" font-weight="600">⑧ 构造 ProduceAck 响应帧</text>

    <!-- 11 -->
    <line x1="560" y1="452" x2="322" y2="452" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="441" y="444" text-anchor="middle" font-weight="600">⑨ [TCP] 回传响应帧</text>

    <!-- 12 self -->
    <path d="M 310 480 h 18 v 26 h -18" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="340" y="484" font-weight="600">⑩ 校验 correlationId 匹配</text>

    <!-- 13 -->
    <line x1="310" y1="520" x2="132" y2="520" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="221" y="512" text-anchor="middle" font-weight="600">⑪ send() 返回 offset（已落盘）</text>
  </g>
</svg>
