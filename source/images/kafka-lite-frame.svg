<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect x="0" y="0" width="960" height="320" fill="#ffffff"/>

  <text x="40" y="40" font-size="17" font-weight="700" fill="#0f172a">协议帧格式（大端序 · Big-Endian）</text>

  <!-- 帧字节条 -->
  <rect x="40" y="70" width="70" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="110" y="70" width="40" height="50" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="150" y="70" width="40" height="50" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="190" y="70" width="64" height="50" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
  <rect x="254" y="70" width="64" height="50" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
  <rect x="318" y="70" width="170" height="50" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="5 3"/>

  <g font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">
    <text x="75" y="92">magic</text>
    <text x="75" y="110" font-size="11.5" fill="#475569">2B "KL"</text>
    <text x="130" y="92">version</text>
    <text x="130" y="110" font-size="11.5" fill="#475569">1B</text>
    <text x="170" y="92">type</text>
    <text x="170" y="110" font-size="11.5" fill="#475569">1B</text>
    <text x="222" y="92">correlationId</text>
    <text x="222" y="110" font-size="11.5" fill="#475569">4B</text>
    <text x="286" y="92">bodyLen</text>
    <text x="286" y="110" font-size="11.5" fill="#475569">4B</text>
    <text x="403" y="92">body</text>
    <text x="403" y="110" font-size="11.5" fill="#475569">N B</text>
  </g>

  <!-- 大括号：header 12 字节 -->
  <path d="M 40 138 h 278 v 10" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <path d="M 318 138 v 10" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <text x="179" y="166" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">header 固定 12 字节，之后是 body</text>

  <!-- 注释 -->
  <g font-size="13" fill="#334155">
    <text x="40" y="206">· magic "KL" + version 用于握手识别与协议版本协商</text>
    <text x="40" y="234">· type = MessageType：请求编码 1–6，响应编码 11 及以上；responseType() 完成映射</text>
    <text x="40" y="262">· correlationId 客户端每请求自增，broker 原样回传，客户端校验一致（同步串行，无乱序）</text>
    <text x="40" y="290">· 字符串用 writeUTF（2 字节长度前缀），byte[] 用 [int 长度][数据]，可空串用 [bool][writeUTF]</text>
  </g>
</svg>
